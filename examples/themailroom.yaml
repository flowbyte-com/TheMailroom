# Example configuration for TheMailroom.
#
# Copy to /etc/themailroom/themailroom.yaml (or any path) and edit.
# The server validates this file on startup; unknown fields and
# duplicate keys are rejected, and the schema is otherwise strict.
#
# Outbound submission is implemented (Phase 2.3, PRs #10-#12; docs PR #13
# merged as a4851e9). An account with the "send" capability can use the
# send_message MCP tool. Submission is TLS-only (implicit TLS or mandatory
# STARTTLS) and authenticates with AUTH PLAIN; the server must advertise
# that mechanism.
# The Purelymail smoke-test campaign was executed on 2026-10-21 and passed.
# It is interoperability/smoke-test evidence, not production certification.
# See docs/LIVE_SMTP_SMOKE_TEST.md for the authoritative record.

server:
  log_level: info            # debug, info, warn, error
  max_request_bytes: 33554432  # optional per-frame inbound cap; 32 MiB default, 128 MiB maximum

accounts:
  # A read-only account that connects to a real IMAP server.
  - id: personal
    provider: purelymail     # informational label, no provider-specific code
    email: alice@example.test

    imap:
      host: imap.example.test
      port: 993              # 993 for implicit TLS, 143 for STARTTLS
      tls: true              # implicit TLS; set false if port=143 + starttls
      username: alice@example.test

      # Recommended: ask an external secret manager for the password.
      # This avoids putting the secret in the config file. The server
      # waits for the command to exit and reads its stdout (trimmed).
      password_command: ["pass", "email/imap/personal"]

      # Provider-issued app passwords are accepted as ordinary password
      # values through password or password_command; there is no separate
      # app_password field. IMAP and SMTP credentials are independent. A
      # 2FA provider may require an app password; it works only if the
      # provider permits IMAP LOGIN and SMTP AUTH PLAIN over TLS. OAuth2-only
      # providers remain unsupported.
      #
      # Alternatively, store the password directly. NEVER commit a file
      # with this field set; chmod 600 the file.
      # password: hunter2

    # SMTP settings are optional for this read-only account. They would be
    # validated only if "send" were granted.
    smtp:
      host: smtp.example.test
      port: 587              # 587 for STARTTLS submission, 465 for implicit TLS
      starttls: true         # mandatory STARTTLS; use tls: true for implicit TLS
      username: alice@example.test
      password_command: ["pass", "email/smtp/personal"]

    permissions:
      - read

    limits:
      max_message_bytes: 26214400          # 25 MiB
      max_attachment_bytes: 6291456        # 6 MiB per attachment
      max_total_attachment_bytes: 26214400 # 25 MiB total
      max_attachments: 50
      max_recipients: 50
      max_search_results: 500
      max_batch_operations: 50
      max_list_scan_messages: 10000   # messages one list or search operation may examine
      max_mime_nesting: 16
      max_mime_parts: 500

    attachment_send_paths: []        # empty = no outbound attachment source

  # A second account that can send. Phase 2.3 PR 1 validated this
  # configuration and opened the attachment roots; PR 2 provided the
  # bounded MIME composer; PR 3 provided the authenticated SMTP sender and
  # registered send_message. All three PRs are merged. Successful
  # submission means the SMTP server accepted the message after DATA; it
  # is not final mailbox delivery. No automatic Sent-folder copy is made,
  # and ambiguous outcomes are never retried automatically.
  - id: work
    email: alice@work.example.test
    imap:
      host: imap.work.example.test
      username: alice@work.example.test
      password_command: ["secret-tool", "lookup", "imap/work"]
    smtp:
      host: smtp.work.example.test
      starttls: true         # mandatory STARTTLS (use tls: true for implicit 465)
      username: alice@work.example.test
      password_command: ["secret-tool", "lookup", "smtp/work"]
    permissions:
      - read
      - send
      - attachment_send

    # Optional exact allow-list. Empty/omitted means any recipient.
    # Local-part case is significant; domain case is normalized. It is
    # enforced before any SMTP connection.
    allowed_recipients:
      - alice@work.example.test
      - team@work.example.test

    # Absolute existing directories. Outbound send_message references are
    # relative; absolute paths, traversal, symlink escapes and non-regular
    # files are rejected. Empty means no attachment source. Presence of an
    # attachment also requires the attachment_send permission above.
    attachment_send_paths:
      - /home/alice/Documents/Outbound

    limits:
      max_message_bytes: 10485760       # 10 MiB final serialized message
      max_attachment_bytes: 2621440     # 2.5 MiB decoded per attachment
      max_total_attachment_bytes: 10485760
      max_attachments: 10
      max_recipients: 20                # unique To + Cc + Bcc; duplicates collapse
      max_list_scan_messages: 10000    # messages one list or search operation may examine
      max_mime_nesting: 8
      max_mime_parts: 200