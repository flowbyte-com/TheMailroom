# Example configuration for TheMailroom.
#
# Copy to /etc/themailroom/themailroom.yaml (or any path) and edit.
# The server validates this file on startup; unknown fields and
# duplicate keys are rejected, and the schema is otherwise strict.

server:
  log_level: info            # debug, info, warn, error

accounts:
  # A read-only account that connects to a real IMAP server.
  - id: personal
    provider: purelymail     # informational label, no provider-specific code
    email: alice@example.test

    imap:
      host: imap.example.test
      port: 993              # 993 for implicit TLS, 143 for STARTTLS
      tls: true              # implicit TLS; set false if port=143 + starttls
      username: alice@example.test

      # Recommended: ask an external secret manager for the password.
      # This avoids putting the secret in the config file. The server
      # waits for the command to exit and reads its stdout (trimmed).
      password_command: ["pass", "email/imap/personal"]

      # Alternatively, store the password directly. NEVER commit a file
      # with this field set; chmod 600 the file.
      # password: hunter2

    smtp:
      host: smtp.example.test
      port: 587              # 587 for STARTTLS submission, 465 for implicit TLS
      starttls: true         # upgrade plain TCP to TLS
      username: alice@example.test
      password_command: ["pass", "email/smtp/personal"]

    permissions:
      - read

    limits:
      max_message_bytes: 26214400          # 25 MiB
      max_attachment_bytes: 6291456        # 6 MiB per attachment
      max_total_attachment_bytes: 26214400 # 25 MiB total
      max_attachments: 50
      max_recipients: 50
      max_search_results: 500
      max_batch_operations: 50
      max_mime_nesting: 16
      max_mime_parts: 500

    attachment_send_paths: []        # empty = no outbound attachment source

  # A second account that can send. Phase 2.3 PR 1 validates this
  # configuration and opens the attachment roots; PR 2 adds a bounded
  # MIME composer. SMTP submission and send_message are not implemented
  # yet.
  - id: work
    email: alice@work.example.test
    imap:
      host: imap.work.example.test
      username: alice@work.example.test
      password_command: ["secret-tool", "lookup", "imap/work"]
    smtp:
      host: smtp.work.example.test
      starttls: true         # mandatory STARTTLS (use tls: true for 465)
      username: alice@work.example.test
      password_command: ["secret-tool", "lookup", "smtp/work"]
    permissions:
      - read
      - send
      - attachment_send

    # Optional exact allow-list. Empty/omitted means any recipient.
    # Local-part case is significant; domain case is normalized.
    allowed_recipients:
      - alice@work.example.test
      - team@work.example.test

    # Absolute existing directories. Outbound references are relative;
    # absolute paths, traversal, symlink escapes and non-regular files are
    # rejected. Empty means no attachment source.
    attachment_send_paths:
      - /home/alice/Documents/Outbound

    limits:
      max_message_bytes: 10485760       # 10 MiB final serialized message
      max_attachment_bytes: 2621440     # 2.5 MiB decoded per attachment
      max_total_attachment_bytes: 10485760
      max_attachments: 10
      max_recipients: 20                # unique To + Cc + Bcc
      max_mime_nesting: 8
      max_mime_parts: 200