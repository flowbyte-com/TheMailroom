name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test (race)
        run: go test -race ./...

      - name: Go formatting
        run: |
          if [ "$(gofmt -l . | wc -l)" -ne 0 ]; then
            echo "Files need gofmt:"
            gofmt -l .
            exit 1
          fi

  cross:
    name: cross-platform build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Build linux/amd64
        run: GOOS=linux GOARCH=amd64 go build -o bin/themailroom-linux-amd64 ./cmd/themailroom
      - name: Build linux/arm64
        run: GOOS=linux GOARCH=arm64 go build -o bin/themailroom-linux-arm64 ./cmd/themailroom
      - name: Build darwin/amd64
        run: GOOS=darwin GOARCH=amd64 go build -o bin/themailroom-darwin-amd64 ./cmd/themailroom
      - name: Build darwin/arm64
        run: GOOS=darwin GOARCH=arm64 go build -o bin/themailroom-darwin-arm64 ./cmd/themailroom
      - name: Build windows/amd64
        run: GOOS=windows GOARCH=amd64 go build -o bin/themailroom-windows-amd64.exe ./cmd/themailroom

  full-test-suite:
    # This job is the required status check on main. It must run even when a
    # dependency fails, is cancelled or is skipped, so that the required check
    # reports failure rather than disappearing.
    name: Full test suite
    needs: [test, cross]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required job succeeded
        run: |
          echo "test result:  ${{ needs.test.result }}"
          echo "cross result: ${{ needs.cross.result }}"
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.cross.result }}" != "success" ]; then
            echo "::error::One or more required jobs did not succeed"
            exit 1
          fi
